<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hibrit Karaciğer Tanı Asistanı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; padding: 40px 0; border-radius: 0 0 30px 30px; margin-bottom: 30px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); background: #ffffff; }
        .form-label { font-weight: 600; color: #333; font-size: 0.95rem; }
        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #ced4da; }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15); }
    </style>
</head>
<body>
    <div class="hero-section text-center">
        <div class="container">
            <h1 class="display-5 fw-bold mb-2"><i class="fa-solid fa-notes-medical me-2"></i>Hibrit Karaciğer Sağlık Asistanı</h1>
            <p class="lead text-light opacity-88">Değerleri dilediğiniz gibi özgürce girerek analiz başlatabilirsiniz.</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card p-4 p-md-5">
                    <form action="/predict" method="POST" enctype="multipart/form-data">
                        
                        <h4 class="mb-3 text-primary fw-bold">1. Klinik Kan Tahlili Değerleri</h4>
                        <p class="text-muted small mb-4">Tüm alanlara istediğiniz sayısal değerleri doğrudan yazabilirsiniz.</p>
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Yaş</label>
                                <input type="number" step="any" class="form-control" name="age" required placeholder="Örn: 45">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Cinsiyet (Erkek için 1, Kadın için 0)</label>
                                <input type="number" step="any" class="form-control" name="gender" required placeholder="Örn: 1 veya 0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Toplam Bilirubin</label>
                                <input type="number" step="any" class="form-control" name="total_bilirubin" required placeholder="Örn: 1.2">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Direkt Bilirubin</label>
                                <input type="number" step="any" class="form-control" name="direct_bilirubin" required placeholder="Örn: 0.3">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Alkalen Fosfataz (ALP)</label>
                                <input type="number" step="any" class="form-control" name="alkaline_phosphotase" required placeholder="Örn: 115">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Alanin Aminotransferaz (ALT)</label>
                                <input type="number" step="any" class="form-control" name="alamine_aminotransferase" required placeholder="Örn: 30">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Aspartat Aminotransferaz (AST)</label>
                                <input type="number" step="any" class="form-control" name="aspartate_aminotransferase" required placeholder="Örn: 25">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Toplam Protein</label>
                                <input type="number" step="any" class="form-control" name="total_proteins" required placeholder="Örn: 6.8">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Albumin</label>
                                <input type="number" step="any" class="form-control" name="albumin" required placeholder="Örn: 3.5">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Albumin / Globulin Oranı</label>
                                <input type="number" step="any" class="form-control" name="albumin_globulin_ratio" required placeholder="Örn: 1.0">
                            </div>
                        </div>

                        <hr class="my-5">

                        <h4 class="mb-3 text-success fw-bold">2. Karaciğer Ultrason Görüntüsü</h4>
                        <div class="mb-4">
                            <input type="file" class="form-control" name="image" accept="image/*" required>
                            <div class="form-text text-secondary mt-1">Desteklenen formatlar: JPG, PNG.</div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success btn-lg py-3 fw-bold">
                                <i class="fa-solid fa-brain me-2"></i>Hibrit Analizi Başlat
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
